services:
  finan:
    build: .
    ports:
      - '127.0.0.1:${FINAN_PORT:-3333}:3000'
    volumes:
      - ./data:/data
    environment:
      - WUZAPI_URL=http://wuzapi:8088
      - WUZAPI_USER_TOKEN=${WUZAPI_USER_TOKEN:-finan-whatsapp-token}
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - WUZAPI_WEBHOOK_URL=http://finan:3000/api/whatsapp/webhook
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    restart: unless-stopped

  wuzapi:
    image: agent-zap-wuzapi:local
    ports:
      - '127.0.0.1:${WUZAPI_PORT:-8088}:8088'
    volumes:
      - ./wuzapi-data:/data
      - ./wuzapi.env:/app/.env:ro
    command:
      - '--datadir=/data'
    restart: unless-stopped